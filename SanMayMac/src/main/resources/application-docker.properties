spring.application.name=SanMayMac

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

logging.level.liquibase=DEBUG
logging.level.org.springframework.boot.liquibase=DEBUG

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.auth.verify-email-url-template=http://localhost:8080/api/auth/verify-email?token=%s

spring.data.redis.host=${SPRING_REDIS_HOST}
spring.data.redis.port=${SPRING_REDIS_PORT}

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD}

app.firebase.service-account-json=${FIREBASE_SERVICE_ACCOUNT_JSON}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS}
app.auth.verify-token-exp-minutes=${AUTH_VERIFY_TOKEN_EXP_MINUTES}
app.auth.reset-token-exp-minutes=${AUTH_RESET_TOKEN_EXP_MINUTES}
app.auth.refresh-token-exp-minutes=${AUTH_REFRESH_TOKEN_EXP_MINUTES}
app.auth.bootstrap-admin-secret=${AUTH_BOOTSTRAP_ADMIN_SECRET:}

app.storage.provider=${APP_STORAGE_PROVIDER:local}
app.storage.upload-dir=${APP_STORAGE_UPLOAD_DIR:uploads}
app.storage.s3.bucket=${APP_STORAGE_S3_BUCKET:}
app.storage.s3.region=${APP_STORAGE_S3_REGION:ap-southeast-1}
app.storage.s3.prefix=${APP_STORAGE_S3_PREFIX:uploads}
app.storage.s3.public-base-url=${APP_STORAGE_S3_PUBLIC_BASE_URL:}
app.storage.s3.access-key=${APP_STORAGE_S3_ACCESS_KEY:}
app.storage.s3.secret-key=${APP_STORAGE_S3_SECRET_KEY:}

app.ghn.token=${GHN_TOKEN:}
app.ghn.shop-id=${GHN_SHOP_ID:}
app.ghn.from-district-id=${GHN_FROM_DISTRICT_ID:0}
app.ghn.from-ward-code=${GHN_FROM_WARD_CODE:}
app.ghn.service-type-id=${GHN_SERVICE_TYPE_ID:2}
app.ghn.base-url=${GHN_BASE_URL:https://dev-online-gateway.ghn.vn/shiip/public-api}

app.momo.endpoint=${MOMO_ENDPOINT:}
app.momo.partner-code=${MOMO_PARTNER_CODE:}
app.momo.access-key=${MOMO_ACCESS_KEY:}
app.momo.secret-key=${MOMO_SECRET_KEY:}
app.momo.redirect-url=${MOMO_REDIRECT_URL:}
app.momo.ipn-url=${MOMO_IPN_URL:}
app.momo.request-type=${MOMO_REQUEST_TYPE:captureWallet}

server.port=8080
app.cors.allowed-origin-patterns=*

app.dev.seed-accounts=${APP_DEV_SEED_ACCOUNTS:true}
