databaseChangeLog:
  - changeSet:
      id: 021-complaint-dispute-module
      author: copilot
      changes:
        - createTable:
            tableName: complaints
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: order_id
                  type: bigint
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: customer_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: workshop_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: reason
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(30)
                  defaultValue: PENDING
                  constraints:
                    nullable: false
              - column:
                  name: admin_note
                  type: text
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
        - createTable:
            tableName: complaint_images
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: complaint_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: image_url
                  type: varchar(500)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
        - createTable:
            tableName: disputes
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: complaint_id
                  type: bigint
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: order_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: customer_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: workshop_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(30)
                  defaultValue: OPEN
                  constraints:
                    nullable: false
              - column:
                  name: admin_request_info
                  type: text
              - column:
                  name: customer_supplement
                  type: text
              - column:
                  name: ruling
                  type: text
              - column:
                  name: refund_processed
                  type: boolean
                  defaultValueBoolean: false
              - column:
                  name: escrow_released
                  type: boolean
                  defaultValueBoolean: false
              - column:
                  name: violation_recorded
                  type: boolean
                  defaultValueBoolean: false
              - column:
                  name: violation_note
                  type: text
              - column:
                  name: resolved_at
                  type: timestamp with time zone
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
        - createTable:
            tableName: workshop_violation_records
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: workshop_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: dispute_id
                  type: bigint
              - column:
                  name: order_id
                  type: bigint
              - column:
                  name: description
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: created_by_admin_id
                  type: bigint
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
